<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240" role="img" aria-labelledby="title desc"><title id="title">Observer data pipeline</title><desc id="desc">Read-only collection, normalization, optional validation and administrator review.</desc><defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#B1D4C1" stroke-width=".55" fill="none"/></pattern><radialGradient id="glow"><stop stop-color="#087B44" stop-opacity=".20"/><stop offset="1" stop-color="#087B44" stop-opacity="0"/></radialGradient></defs><rect x="1" y="1" width="1198" height="238" rx="20" fill="#F0F7F2" stroke="#B1D4C1"/><rect x="2" y="2" width="1196" height="236" rx="19" fill="url(#grid)" opacity=".5"/><text x="32" y="36" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4B705B" letter-spacing="1.5" >OBSERVER / DATA PIPELINE</text><rect x="32" y="65" width="263" height="116" rx="12" fill="#FFFFFF" stroke="#B1D4C1"/><text x="47" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4B705B" letter-spacing="1.5" >01 / COLLECT</text><text x="47" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#153A29" font-weight="600">Keenetic NAT</text><text x="47" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4B705B" >Existing VPN route</text><path d="M295 123h28m-7-6 7 6-7 6" stroke="#087B44" stroke-width="1.7" fill="none"/><rect x="323" y="65" width="263" height="116" rx="12" fill="#FFFFFF" stroke="#B1D4C1"/><text x="338" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#4B705B" letter-spacing="1.5" >02 / NORMALIZE</text><text x="338" y="123" font-family="Segoe UI,Arial,sans-serif" font-size="19" fill="#153A29" font-weight="600">Original endpoints</text><text x="338" y="153" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#4B705B" >CSV + deduplication</text><path d="M586 123h28m-7-6 7 6-7 6" stroke="#087B44" stroke-width="1.7" fil
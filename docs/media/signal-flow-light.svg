<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">From connection to evidence</title><desc id="desc">Four-stage conceptual workflow: collect, normalize, verify optionally, and review.</desc><defs><linearGradient id="accent"><stop stop-color="#146B9A"/><stop offset="1" stop-color="#6955BD"/></linearGradient></defs><rect x="1" y="1" width="1198" height="258" rx="18" fill="#F3F5FB" stroke="#C9D4E4" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="41" font-size="14" letter-spacing="3" fill="#53657D">THE EVIDENCE PIPELINE</text><text x="1170" y="41" text-anchor="end" font-size="14" fill="#53657D">LOCAL WORKFLOW / CONCEPT</text><rect x="30" y="65" width="261" height="153" rx="12" fill="#FFFFFF" stroke="#C9D4E4"/><text x="48" y="94" font-size="14" fill="#146B9A" letter-spacing="2">01</text><path d="M48 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="48" y="153" font-size="24" font-weight="700" fill="#17263B">COLLECT</text><text x="48" y="183" font-size="17" fill="#53657D">NAT / VPN route</text><path d="M299 141h16m-6-6 6 6-6 6" stroke="#146B9A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="323" y="65" width="261" height="153" rx="12" fill="#FFFFFF" stroke="#C9D4E4"/><text x="341" y="94" font-size="14" fill="#6955BD" letter-spacing="2">02</text><path d="M341 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="341" y="153" font-size="24" font-weight="700" fill="#17263B">NORMALIZE</text><text x="341" y="183" font-size="17" fill="#53657D">Filter / deduplicate</text><path d="M592 141h16m-6-6 6 6-6 6" stroke="#146B9A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="616" y="65" width="261" height="153" rx="12" fill="#FFFFFF" stroke="#C9D4E4"/><text x="634" y="94" font-size="14" fill="#146B9A" letter-spacing="2">03</text><path d="M634 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="634" y="153" font-size="24" font-weight="700" fill="#17263B">VERIFY</text><text x="634" y="183" font-size="17" fill="#53657D">Observed TCP only</text><path d="M885 141h16m-6-6 6 6-6 6" stroke="#146B9A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="909" y="65" width="261" height="153" rx="12" fill="#FFFFFF" stroke="#C9D4E4"/><text x="927" y="94" font-size="14" fill="#6955BD" letter-spacing="2">04</text><path d="M927 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="927" y="153" font-size="24" font-weight="700" fill="#17263B">REVIEW</text><text x="927" y="183" font-size="17" fill="#53657D">CSV / XLSX evidence</text><text x="30" y="244" font-size="12" fill="#53657D" letter-spacing=".9">ORIGINAL REPORTS PRESERVED</text><text x="1170" y="244" text-anchor="end" font-size="12" fill="#53657D" letter-spacing=".9">ADMINISTRATOR REVIEW REQUIRED</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="822" viewBox="0 0 1200 822" role="img" aria-labelledby="title desc"><title id="title">От подключения к доказательствам</title><desc id="desc">01 / Сбор: Сбор разрешённых наблюдений NAT или импорт CSV центрального шлюза.; 02 / Очистка: Проверка IPv4, направления и портов; исключение повторного импорта без изменения оригиналов.; 03 / Проверка: Опциональная проверка наблюдаемых частных TCP-назначений без прикладных данных.; 04 / Анализ: Экспорт доказательств, сравнение периодов и проверка назначения сервисов перед согласованием правил.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101A"/><stop offset="1" stop-color="#192338"/></linearGradient><linearGradient id="signal"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#40536C" opacity=".5"/></pattern><clipPath id="round"><rect x="1" y="1" width="1198" height="820" rx="22"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="822" fill="url(#bg)"/><rect x="780" width="420" height="822" fill="url(#dots)" opacity=".45"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="39" font-size="15" fill="#A0AEC3" letter-spacing="2.5">OBSERVER / SIGNAL / 04</text><text x="36" y="87" font-size="43" font-weight="700" fill="#F0F5FF">От подключения к доказательствам</text></g><g transform="translate(1117 59)" stroke="#69DFFF" fill="none"><circle r="28" stroke="#40536C" stroke-dasharray="2 5"/><circle r="20" stroke="#B3A0FF"/><path d="M-13 0h5l5-10 7 20 5-10h6" stroke-width="2" stroke-linejoin="round"/></g><rect x="36" y="120" width="1128" height="122" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 138v86" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="152" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="162">01 / Сбор</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="198">Сбор разрешённых наблюдений NAT или импорт CSV центрального шлюза.</text></g><rect x="36" y="256" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 274v121" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="288" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="298">02 / Очистка</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="334">Проверка IPv4, направления и портов; исключение повторного импорта</text><text x="87" y="369">без изменения оригиналов.</text></g><rect x="36" y="427" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 445v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="459" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="469">03 / Проверка</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="505">Опциональная проверка наблюдаемых частных TCP-назначений без</text><text x="87" y="540">прикладных данных.</text></g><rect x="36" y="598" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 616v121" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="630" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="640">04 / Анализ</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="676">Экспорт доказательств, сравнение периодов и проверка назначения</text><text x="87" y="711">сервисов перед согласованием правил.</text></g><path d="M36 780H1164" 
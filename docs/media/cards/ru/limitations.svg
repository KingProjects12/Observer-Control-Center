<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1374" viewBox="0 0 1200 1374" role="img" aria-labelledby="title desc"><title id="title">Безопасность и ограничения</title><desc id="desc">Только разрешённые сети: Только сети, которыми вы владеете или управляете с разрешения. VPN REMOTE не создаёт туннель. x-ndw4 не поддерживается.; Интерпретация результатов: NAT может не показать часть LAN/VPN-потоков; отсутствие записи не повод блокировать доступ. Открытый TCP-порт не доказывает назначение сервиса. UDP только наблюдается.; Конфиденциальность: Пароли не сохраняются на диске. Не публикуйте внутренние адреса, дампы и отчёты клиентов.; Защита Windows и обновления: Доверенной Authenticode-подписи пока нет. Не отключайте защиту. SHA-256 подтверждает целостность, не издателя. Перед «Инструменты → Обновления» сохраните отчёты; язык установщика сохраняется. Артефакты Actions не являются релизами.; Лицензия и авторство: Интерфейс разработан самостоятельно с визуальным вдохновением от Atoll. При использовании его кода сохраняйте применимые уведомления MIT. Лицензия Observer не выбрана; публичность исходников не даёт права распространения.; Требования для сборки: Windows 10/11 x64; .NET 10 SDK или Visual Studio с разработкой классических приложений .NET.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101A"/><stop offset="1" stop-color="#192338"/></linearGradient><linearGradient id="signal"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#40536C" opacity=".5"/></pattern><clipPath id="round"><rect x="1" y="1" width="1198" height="1372" rx="22"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="1374" fill="url(#bg)"/><rect x="780" width="420" height="1374" fill="url(#dots)" opacity=".45"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="39" font-size="15" fill="#A0AEC3" letter-spacing="2.5">OBSERVER / SIGNAL / 08</text><text x="36" y="87" font-size="43" font-weight="700" fill="#F0F5FF">Безопасность и ограничения</text></g><g transform="translate(1117 59)" stroke="#69DFFF" fill="none"><circle r="28" stroke="#40536C" stroke-dasharray="2 5"/><circle r="20" stroke="#B3A0FF"/><path d="M-13 0h5l5-10 7 20 5-10h6" stroke-width="2" stroke-linejoin="round"/></g><rect x="36" y="120" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 138v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="152" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="162">Только разрешённые сети</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="198">Только сети, которыми вы владеете или управляете с разрешения. VPN</text><text x="87" y="233">REMOTE не создаёт туннель. x-ndw4 не поддерживается.</text></g><rect x="36" y="291" width="1128" height="192" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 309v156" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="323" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="333">Интерпретация результатов</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="369">NAT может не показать часть LAN/VPN-потоков; отсутствие записи не</text><text x="87" y="404">повод блокировать доступ. Открытый TCP-порт не доказывает</text><text x="87" y="439">назначение сервиса. UDP только наблюдается.</text></g><rect x="36" y="497" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 515v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="529" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="539">Конфиденциальность</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="575">Пароли не сохраняются на диске. Не публикуйте внутренние адреса,</text><text x="87" y="610">дампы и отчёты клиентов.</text></g><rect x="36" y="668" width="1128" height="227" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 686v191" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="700" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="710">Защита Windows и обновления</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="746">Доверенной Authenticode-подписи пока нет. Не отключайте защиту.</text><text x="87" y="781">SHA-256 подтверждает целостность, не издателя. Перед «Инструменты</text><text x="87" y="816">→ Обновления» сохраните отчёты; язык установщика сохраняется.</text><text x="87" y="851">Артефакты Actions не являются релизами.</text></g><rect x="36" y="909" width="1128" height="227" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 927v191" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="941" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="951">Лицензия и авторство</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="987">Интерфейс разработан самостоятельно с визуальным вдохновением от</text><text x="87" y="1022">Atoll. При использовании его кода сохраняйте применимые уведомления</text><text x="87" y="1057">MIT. Лицензия Observer не выбрана; публичность исходников не даёт</text><text x="87" y="1092">права распространения.</text></g><rect x="36" y="1150" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 1168v121" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="1182" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="1192">Требования для сборки</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="1228">Windows 10/11 x64; .NET 10 SDK или Visual Studio с разработкой</text><text x="87" y="1263">классических приложений .NET.</text></g><path d="M36 1332H1164" stroke="#29394E"/><text x="36" y="1354" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">KINGPROJECTS / NETWORK TOOLS</text><text x="1164" y="1354" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">08 / 08</text></g><rect x="1" y="1" width="1198" height="1372" rx="22" fill="none" stroke="#29394E" stroke-width="2"/></svg>
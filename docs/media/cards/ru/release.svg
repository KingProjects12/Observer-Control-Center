<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="993" viewBox="0 0 1200 993" role="img" aria-labelledby="title desc"><title id="title">История версий</title><desc id="desc">2.1.0 / Access Analyzer: Сбор, очистка, TCP-диагностика, повторный сбор и сравнение периодов. Этапы 2.0.17–2.0.19 вошли в релиз и отдельно не публиковались.; 2.0.16: Массовый сбор NAT и общие отчёты.; 2.0.15: Рабочая область, интерфейс и установщик.; 2.0.12: Интеграция оригинального сборщика в WPF.; Статус проверки: В документации указаны успешные Windows-сборки и офлайн-тесты. Нужна проверка 2.1.0 на разрешённых реальных сетях. Реализация не означает совместимость со всеми роутерами.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101A"/><stop offset="1" stop-color="#192338"/></linearGradient><linearGradient id="signal"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#40536C" opacity=".5"/></pattern><clipPath id="round"><rect x="1" y="1" width="1198" height="991" rx="22"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="993" fill="url(#bg)"/><rect x="780" width="420" height="993" fill="url(#dots)" opacity=".45"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="39" font-size="15" fill="#A0AEC3" letter-spacing="2.5">OBSERVER / SIGNAL / 07</text><text x="36" y="87" font-size="43" font-weight="700" fill="#F0F5FF">История версий</text></g><g transform="translate(1117 59)" stroke="#69DFFF" fill="none"><circle r="28" stroke="#40536C" stroke-dasharray="2 5"/><circle r="20" stroke="#B3A0FF"/><path d="M-13 0h5l5-10 7 20 5-10h6" stroke-width="2" stroke-linejoin="round"/></g><rect x="36" y="120" width="1128" height="192" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 138v156" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="152" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="162">2.1.0 / Access Analyzer</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="198">Сбор, очистка, TCP-диагностика, повторный сбор и сравнение</text><text x="87" y="233">периодов. Этапы 2.0.17–2.0.19 вошли в релиз и отдельно не</text><text x="87" y="268">публиковались.</text></g><rect x="36" y="326" width="1128" height="122" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 344v86" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="358" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="368">2.0.16</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="404">Массовый сбор NAT и общие отчёты.</text></g><rect x="36" y="462" width="1128" height="122" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 480v86" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="494" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="504">2.0.15</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="540">Рабочая область, интерфейс и установщик.</text></g><rect x="36" y="598" width="1128" height="122" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 616v86" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="630" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="640">2.0.12</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="676">Интеграция оригинального сборщика в WPF.</text></g><rect x="36" y="734" width="1128" height="192" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 752v156" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="766" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="776">Статус проверки</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="812">В документации указаны успешные Windows-сборки и офлайн-тесты.</text><text x="87" y="847">Нужна проверка 2.1.0 на разрешённых реальных сетях. Реализация не</text><text x="87" y="882">означает совместимость со всеми роутерами.</text></g><path d="M36 951H1164" stroke="#29394E"/><text x="36" y="973" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">KINGPROJECTS / NETWORK TOOLS</text><text x="1164" y="973" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">07 / 08</text></g><rect x="1" y="1" width="1198" height="991" rx="22" fill="none" stroke="#29394E" stroke-width="2"/></svg>
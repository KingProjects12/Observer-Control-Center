<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1028" viewBox="0 0 1200 1028" role="img" aria-labelledby="title desc"><title id="title">Быстрый старт</title><desc id="desc">Установка или запуск: Windows 10/11 x64; самодостаточный установщик с ярлыком и выбором языка или portable EXE без установки.; 01 / Подключение: Откройте «Подключение / NAT» или VPN REMOTE при уже подключённом разрешённом VPN.; 02 / Входные данные: Введите IPv4 роутеров по одному на строку, данные входа и сеть офиса IPv4 /24. Предпочтителен HTTPS; HTTP только в доверенной разрешённой сети.; 03 / Сбор NAT: Проверьте статус каждого роутера; при необходимости повторите сбор.; 04 / Анализ и экспорт: Выберите исходные CSV в «АНАЛИЗ ДОСТУПОВ». Анализ, экспорт, опционально TCP-проверка и сравнение периодов.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101A"/><stop offset="1" stop-color="#192338"/></linearGradient><linearGradient id="signal"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#40536C" opacity=".5"/></pattern><clipPath id="round"><rect x="1" y="1" width="1198" height="1026" rx="22"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="1028" fill="url(#bg)"/><rect x="780" width="420" height="1028" fill="url(#dots)" opacity=".45"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="39" font-size="15" fill="#A0AEC3" letter-spacing="2.5">OBSERVER / SIGNAL / 06</text><text x="36" y="87" font-size="43" font-weight="700" fill="#F0F5FF">Быстрый старт</text></g><g transform="translate(1117 59)" stroke="#69DFFF" fill="none"><circle r="28" stroke="#40536C" stroke-dasharray="2 5"/><circle r="20" stroke="#B3A0FF"/><path d="M-13 0h5l5-10 7 20 5-10h6" stroke-width="2" stroke-linejoin="round"/></g><rect x="36" y="120" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 138v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="152" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="162">Установка или запуск</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="198">Windows 10/11 x64; самодостаточный установщик с ярлыком и выбором</text><text x="87" y="233">языка или portable EXE без установки.</text></g><rect x="36" y="291" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 309v121" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="323" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="333">01 / Подключение</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="369">Откройте «Подключение / NAT» или VPN REMOTE при уже подключённом</text><text x="87" y="404">разрешённом VPN.</text></g><rect x="36" y="462" width="1128" height="192" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 480v156" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="494" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="504">02 / Входные данные</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="540">Введите IPv4 роутеров по одному на строку, данные входа и сеть офиса</text><text x="87" y="575">IPv4 /24. Предпочтителен HTTPS; HTTP только в доверенной</text><text x="87" y="610">разрешённой сети.</text></g><rect x="36" y="668" width="1128" height="122" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 686v86" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="700" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="710">03 / Сбор NAT</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="746">Проверьте статус каждого роутера; при необходимости повторите сбор.</text></g><rect x="36" y="804" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 822v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="836" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="846">04 / Анализ и экспорт</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="882">Выберите исходные CSV в «АНАЛИЗ ДОСТУПОВ». Анализ, экспорт,</text><text x="87" y="917">опционально TCP-проверка и сравнение периодов.</text></g><path d="M36 986H1164" stroke="#29394E"/><text x="36" y="1008" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">KINGPROJECTS / NETWORK TOOLS</text><text x="1164" y="1008" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">06 / 08</text></g><rect x="1" y="1" width="1198" height="1026" rx="22" fill="none" stroke="#29394E" stroke-width="2"/></svg>
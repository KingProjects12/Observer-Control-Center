<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">Что такое Observer?</title><desc id="desc">Видимость сети: Приложение Windows для уполномоченных сетевых администраторов. Сбор NAT с управляемых Keenetic в режиме чтения и обработка существующих данных.; Только чтение: Без изменения настроек роутеров и firewall. Отчёты и исходные снимки остаются локально.; Данные, а не догадки: Анализ доступов по CSV/XLSX, опциональная TCP-проверка и ручное согласование.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101A"/><stop offset="1" stop-color="#192338"/></linearGradient><linearGradient id="signal"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#40536C" opacity=".5"/></pattern><clipPath id="round"><rect x="1" y="1" width="1198" height="719" rx="22"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="721" fill="url(#bg)"/><rect x="780" width="420" height="721" fill="url(#dots)" opacity=".45"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="39" font-size="15" fill="#A0AEC3" letter-spacing="2.5">OBSERVER / SIGNAL / 01</text><text x="36" y="87" font-size="43" font-weight="700" fill="#F0F5FF">Что такое Observer?</text></g><g transform="translate(1117 59)" stroke="#69DFFF" fill="none"><circle r="28" stroke="#40536C" stroke-dasharray="2 5"/><circle r="20" stroke="#B3A0FF"/><path d="M-13 0h5l5-10 7 20 5-10h6" stroke-width="2" stroke-linejoin="round"/></g><rect x="36" y="120" width="1128" height="192" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 138v156" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="152" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="162">Видимость сети</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="198">Приложение Windows для уполномоченных сетевых администраторов.</text><text x="87" y="233">Сбор NAT с управляемых Keenetic в режиме чтения и обработка</text><text x="87" y="268">существующих данных.</text></g><rect x="36" y="326" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 344v121" stroke="#B3A0FF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="358" r="5" fill="#B3A0FF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#B3A0FF" font-size="30" font-weight="600"><text x="87" y="368">Только чтение</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="404">Без изменения настроек роутеров и firewall. Отчёты и исходные снимки</text><text x="87" y="439">остаются локально.</text></g><rect x="36" y="497" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 515v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><circle cx="65" cy="529" r="5" fill="#69DFFF"/><g font-family="Segoe UI, Arial, sans-serif" fill="#69DFFF" font-size="30" font-weight="600"><text x="87" y="539">Данные, а не догадки</text></g><g font-family="Segoe UI, Arial, sans-serif" font-size="27" fill="#E2EAF7"><text x="87" y="575">Анализ доступов по CSV/XLSX, опциональная TCP-проверка и ручное</text><text x="87" y="610">согласование.</text></g><path d="M36 679H1164" stroke="#29394E"/><text x="36" y="701" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">KINGPROJECTS / NETWORK TOOLS</text><text x="1164" y="701" text-anchor="end" font-family="Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2" fill="#A0AEC3">01 / 08</text></g><rect x="1" y="1" width="1198" height="719" rx="22" fill="none" stroke="#29394E" stroke-width="2"/></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="958" viewBox="0 0 1200 958" role="img" aria-labelledby="title desc"><title id="title">Release timeline</title><desc id="desc">2.1.0 / Access Analyzer: Collection, cleanup, TCP diagnostics, retry and period comparison. Milestones 2.0.17–2.0.19 were integrated here, not published separately.; 2.0.16: Multi-router NAT and combined reports.; 2.0.15: Workspace guide, UI and installer refinements.; 2.0.12: Original collector integrated into WPF.; Validation status: Release documentation records successful Windows builds and offline tests. Live validation of 2.1.0 on authorized networks is still needed. Features do not imply universal router compatibility.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B101A"/><stop offset="1" stop-color="#192338"/></linearGradient><linearGradient id="signal"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient><pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#40536C" opacity=".5"/></pattern><clipPath id="round"><rect x="1" y="1" width="1198" height="956" rx="22"/></clipPath></defs><g clip-path="url(#round)"><rect width="1200" height="958" fill="url(#bg)"/><rect x="780" width="420" height="958" fill="url(#dots)" opacity=".45"/><g font-family="Segoe UI,Arial,sans-serif"><text x="36" y="39" font-size="15" fill="#A0AEC3" letter-spacing="2.5">OBSERVER / SIGNAL / 07</text><text x="36" y="87" font-size="43" font-weight="700" fill="#F0F5FF">Release timeline</text></g><g transform="translate(1117 59)" stroke="#69DFFF" fill="none"><circle r="28" stroke="#40536C" stroke-dasharray="2 5"/><circle r="20" stroke="#B3A0FF"/><path d="M-13 0h5l5-10 7 20 5-10h6" stroke-width="2" stroke-linejoin="round"/></g><rect x="36" y="120" width="1128" height="157" rx="16" fill="#121B2B" stroke="#29394E"/><path d="M36 138v121" stroke="#69DFFF" stroke-width="3" stroke-linecap="round"/><c
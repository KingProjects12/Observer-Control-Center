<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc"><title id="title">From connection to evidence</title><desc id="desc">Four-stage conceptual workflow: collect, normalize, verify optionally, and review.</desc><defs><linearGradient id="accent"><stop stop-color="#69DFFF"/><stop offset="1" stop-color="#B3A0FF"/></linearGradient></defs><rect x="1" y="1" width="1198" height="258" rx="18" fill="#0B101A" stroke="#29394E" stroke-width="2"/><g font-family="Segoe UI,Arial,sans-serif"><text x="30" y="41" font-size="14" letter-spacing="3" fill="#A0AEC3">THE EVIDENCE PIPELINE</text><text x="1170" y="41" text-anchor="end" font-size="14" fill="#A0AEC3">LOCAL WORKFLOW / CONCEPT</text><rect x="30" y="65" width="261" height="153" rx="12" fill="#121B2B" stroke="#29394E"/><text x="48" y="94" font-size="14" fill="#69DFFF" letter-spacing="2">01</text><path d="M48 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="48" y="153" font-size="24" font-weight="700" fill="#F0F5FF">COLLECT</text><text x="48" y="183" font-size="17" fill="#A0AEC3">NAT / VPN route</text><path d="M299 141h16m-6-6 6 6-6 6" stroke="#69DFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="323" y="65" width="261" height="153" rx="12" fill="#121B2B" stroke="#29394E"/><text x="341" y="94" font-size="14" fill="#B3A0FF" letter-spacing="2">02</text><path d="M341 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="341" y="153" font-size="24" font-weight="700" fill="#F0F5FF">NORMALIZE</text><text x="341" y="183" font-size="17" fill="#A0AEC3">Filter / deduplicate</text><path d="M592 141h16m-6-6 6 6-6 6" stroke="#69DFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="616" y="65" width="261" height="153" rx="12" fill="#121B2B" stroke="#29394E"/><text x="634" y="94" font-size="14" fill="#69DFFF" letter-spacing="2">03</text><path d="M634 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="634" y="153" font-size="24" font-weight="700" fill="#F0F5FF">VERIFY</text><text x="634" y="183" font-size="17" fill="#A0AEC3">Observed TCP only</text><path d="M885 141h16m-6-6 6 6-6 6" stroke="#69DFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="909" y="65" width="261" height="153" rx="12" fill="#121B2B" stroke="#29394E"/><text x="927" y="94" font-size="14" fill="#B3A0FF" letter-spacing="2">04</text><path d="M927 112h42" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/><text x="927" y="153" font-size="24" font-weight="700" fill="#F0F5FF">REVIEW</text><text x="927" y="183" font-size="17" fill="#A0AEC3">CSV / XLSX evidence</text><text x="30" y="244" font-size="12" fill="#A0AEC3" letter-spacing=".9">ORIGINAL REPORTS PRESERVED</text><text x="1170" y="244" text-anchor="end" font-size="12" fill="#A0AEC3" letter-spacing=".9">ADMINISTRATOR REVIEW REQUIRED</text></g></svg>
name: Windows build, update tests and preview artifact
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Public repository safety preflight
        shell: pwsh
        run: ./tools/PublicSourceAudit.ps1
      - name: Offline update logic tests
        shell: pwsh
        run: |
          dotnet run --project Tests/Observer.UpdateTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Update tests failed' }
          dotnet run --project LegacyCollectorTests/LegacyCollectorTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Legacy collector tests failed' }
      - name: Compile Windows WPF
        shell: pwsh
        run: dotnet build Observer.ControlCenter.csproj --configuration Release
      - name: Verify generated Windows ICO
        shell: pwsh
        run: |
          $path = "Assets/ObserverApp.ico"
          if (!(Test-Path $path)) { throw "ICO missing from build" }
          $b = [System.IO.File]::ReadAllBytes((Resolve-Path $path))
          if ($b.Length -lt 100 -or $b[0] -ne 0 -or $b[1] -ne 0 -or $b[2] -ne 1 -or $b[3] -ne 0) {
            throw "Invalid Windows ICO header"
          }
          Write-Host "App icon OK ($($b.Length) bytes)"
      - name: Publish self-contained preview EXE
        shell: pwsh
        run: |
          dotnet publish Observer.ControlCenter.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false `
            "-p:ObserverUpdateRepo=$env:GITHUB_REPOSITORY" -o dist
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          if (!(Test-Path 'dist/Observer.ControlCenter.exe')) { throw "Missing preview EXE" }
      - name: Build Windows installer (per-user, no administrator rights)
        shell: pwsh
        run: |
          [xml]$project = Get-Content 'Observer.ControlCenter.csproj' -Raw
          $v = $project.Project.PropertyGroup.Version
          ./tools/Build-Installer.ps1 -Version $v -InstallInno
      - name: Validate installer and portable download hashes
        shell: pwsh
        run: |
          $files = @('dist/Observer.ControlCenter.exe') + @(Get-ChildItem 'dist/Observer-Control-Center-Setup-*.exe' | Select-Object -ExpandProperty FullName)
          if ($files.Count -ne 2) { throw 'Expected one portable EXE and one installer EXE' }
          foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))" | Set-Content -Path "$file.sha256" -Encoding ascii
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Observer-preview-win-x64
          path: |
            dist/Observer.ControlCenter.exe
            dist/Observer.ControlCenter.exe.sha256
            dist/Observer-Control-Center-Setup-*.exe
            dist/Observer-Control-Center-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30

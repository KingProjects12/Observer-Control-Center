name: Publish Observer installer and portable EXE to GitHub Releases
on:
  push:
    tags:
      - 'v[0-9]*'
    branches:
      - main
    paths:
      - '.github/release-requests/public-v2.0.12.txt'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v2.0.5 (or v2.1.0-preview.1)'
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: observer-release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Resolve and validate version
        id: meta
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } elseif ($env:GITHUB_REF -eq 'refs/heads/main') {
            # One-time main-branch release, triggered only when its marker is first merged.
            'v2.0.12'
          } else {
            $env:GITHUB_REF_NAME
          }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Invalid release tag: $tag"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Public repository safety preflight
        shell: pwsh
        run: ./tools/PublicSourceAudit.ps1
      - name: Offline update and SemVer tests
        shell: pwsh
        run: |
          dotnet run --project Tests/Observer.UpdateTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Update tests failed' }
          dotnet run --project LegacyCollectorTests/LegacyCollectorTests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { throw 'Legacy collector tests failed' }
      - name: Publish self-contained EXE with icon
        shell: pwsh
        run: |
          dotnet publish Observer.ControlCenter.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false `
            -p:DebugType=None -p:DebugSymbols=false `
            "-p:Version=${{ steps.meta.outputs.version }}" "-p:ObserverUpdateRepo=$env:GITHUB_REPOSITORY" -o dist
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          $exe = 'dist/Observer.ControlCenter.exe'
          if (!(Test-Path $exe)) { throw "EXE missing" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Observer.ControlCenter.exe" | Set-Content -Path "$exe.sha256" -Encoding ascii
      - name: Build Windows installer
        shell: pwsh
        run: |
          ./tools/Build-Installer.ps1 -Version '${{ steps.meta.outputs.version }}' -InstallInno
          $installer = Get-ChildItem 'dist/Observer-Control-Center-Setup-*.exe'
          if ($installer.Count -ne 1) { throw 'Exactly one installer expected' }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Path "$($installer.FullName).sha256" -Encoding ascii
      - name: Create public release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.meta.outputs.tag }}'
          gh release view $tag --json tagName --jq .tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to overwrite."
            exit 0
          }
          $flags = @()
          if ($tag.Contains('-')) { $flags += '--prerelease' }
          $installer = Get-ChildItem 'dist/Observer-Control-Center-Setup-*.exe' | Select-Object -First 1
          if (!$installer) { throw 'Installer for release not found' }
          $notesFile = "docs/RELEASE_${tag}_PUBLIC_TEST.md"
          $releaseNotes = if ((Test-Path $notesFile)) {
            @('--notes-file', $notesFile)
          } else {
            @('--generate-notes')
          }
          gh release create $tag "dist/Observer.ControlCenter.exe" "dist/Observer.ControlCenter.exe.sha256" `
            $installer.FullName "$($installer.FullName).sha256" `
            --target $env:GITHUB_SHA --title "Observer $tag" @releaseNotes @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
